# Netlify build configuration for the React (Vite) portfolio
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — /gallery and any unknown route serve the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for hashed Vite static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Profile photo — short cache so it can be replaced without stale CDN copy
[[headers]]
  for = "/profile.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"