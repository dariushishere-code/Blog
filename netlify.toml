# Netlify build configuration for the Next.js portfolio
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Official Next.js runtime for Netlify (islands, ISR, image optimization)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-lived cache for hashed Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Profile photo — short cache so it can be replaced without stale CDN copy
[[headers]]
  for = "/profile.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"