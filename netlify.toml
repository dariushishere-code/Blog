# Netlify build configuration for the React (Vite) portfolio
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to an exact Node 22 patch: Vite 8/rolldown requires >=22.12.0 and
  # react-router@8 requires >=22.22.0, so a floating "22" can resolve to an
  # older patch on Netlify's build image and break the build.
  NODE_VERSION = "22.23.2"

# SPA fallback — /gallery and any unknown route serve the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for hashed Vite static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Profile photo — short cache so it can be replaced without stale CDN copy
[[headers]]
  for = "/profile.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"